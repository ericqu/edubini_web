<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Microscope</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Microscope">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #000;
    --panel: rgba(28, 28, 32, 0.92);
    --line: rgba(255, 255, 255, 0.14);
    --text: #f2f2f5;
    --muted: #a3a3ad;
    --accent: #7c5cff;
    --accent2: #22c3e6;
    --ok: #4cd97b;
    --warn: #ffb547;
    --bad: #ff5d5d;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  [hidden] { display: none !important; }

  /* live view */
  #live { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #status { position: fixed; top: calc(var(--safe-t) + 14px); left: 16px; padding: 7px 12px 7px 10px;
    border-radius: 999px; background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-size: 14px; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 110px); }
  #status i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  #status.ok i { background: var(--ok); } #status.warn i { background: var(--warn); } #status.bad i { background: var(--bad); }
  #gear { position: fixed; top: calc(var(--safe-t) + 10px); right: 14px; width: 46px; height: 46px; border-radius: 50%;
    background: rgba(0,0,0,0.55); display: grid; place-items: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  /* bottom bar */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 24px calc(var(--safe-b) + 22px);
    display: flex; align-items: center; justify-content: center; gap: 40px;
    background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0)); }
  .shot { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 15px; font-weight: 600;
    text-shadow: 0 1px 3px #000; }
  .shot .disc { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5); transition: transform 0.1s; }
  .shot:active .disc { transform: scale(0.93); }
  .shot:disabled { opacity: 0.4; }
  #btnPhoto .disc { background: #fff; color: #111; border: 5px solid rgba(255,255,255,0.35); background-clip: padding-box; }
  #btnSuper .disc { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; width: 100px; height: 100px; }
  #btnGallery .disc { width: 64px; height: 64px; border-radius: 16px; background: #222 center/cover; border: 2px solid rgba(255,255,255,0.6); }

  /* overlays */
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; }
  #hold { pointer-events: none; flex-direction: column; gap: 16px; text-align: center;
    background: radial-gradient(circle, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%); }
  #hold h2 { margin: 0; font-size: 30px; text-shadow: 0 2px 8px #000; }
  #hold p { margin: 0; font-size: 19px; color: #ddd; text-shadow: 0 2px 6px #000; }
  #ring { width: 120px; height: 120px; }
  #ring circle { fill: none; stroke-width: 9; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 26px 28px;
    width: min(460px, 100%); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .card h2 { margin: 0 0 6px; font-size: 22px; }
  .card p { margin: 0 0 16px; color: var(--muted); line-height: 1.4; }
  #busy { background: rgba(0,0,0,0.6); }
  .bar { height: 12px; border-radius: 6px; background: rgba(255,255,255,0.12); overflow: hidden; }
  .bar div { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.25s; }
  .row { display: flex; gap: 12px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .btn { padding: 11px 18px; border-radius: 12px; background: rgba(255,255,255,0.12); font-weight: 600; }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .btn.danger { background: rgba(255, 93, 93, 0.2); color: #ff8a8a; }

  /* viewer */
  #viewer { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; }
  #vscroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; display: grid; place-items: center; }
  #vimg { display: block; max-width: none; image-rendering: auto; }
  #vtop { position: absolute; top: 0; left: 0; right: 0; padding: calc(var(--safe-t) + 10px) 14px 10px;
    display: flex; gap: 10px; align-items: center; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0)); pointer-events: none; }
  #vtop > * { pointer-events: auto; }
  #vtitle { flex: 1; font-size: 14px; color: #ddd; text-shadow: 0 1px 3px #000; min-width: 0; }
  #vtitle b { display: block; font-size: 17px; color: #fff; }
  .round { width: 46px; height: 46px; border-radius: 50%; background: rgba(40,40,46,0.85); display: grid; place-items: center; flex: none; }
  #vbottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(var(--safe-b) + 16px);
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.75)); }
  .pill { padding: 12px 20px; border-radius: 999px; background: rgba(40,40,46,0.9); font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .pill.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  #vnote { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 84px);
    background: rgba(0,0,0,0.65); border-radius: 12px; padding: 8px 14px; font-size: 14px; color: #ddd; max-width: 90%; text-align: center; }
  #badge { position: absolute; top: calc(var(--safe-t) + 70px); left: 16px; padding: 5px 10px; border-radius: 8px; font-weight: 700; font-size: 13px;
    background: rgba(0,0,0,0.65); letter-spacing: 0.04em; }

  /* gallery */
  #gallery { position: fixed; inset: 0; background: #0b0b0d; display: flex; flex-direction: column; }
  #ghead { padding: calc(var(--safe-t) + 12px) 16px 12px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
  #ghead h2 { margin: 0; flex: 1; font-size: 22px; }
  #grid { flex: 1; overflow: auto; padding: 14px 16px calc(var(--safe-b) + 20px); display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; align-content: start; }
  .tile { position: relative; border-radius: 12px; overflow: hidden; background: #1a1a1e; aspect-ratio: 16 / 9; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile span { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 8px 6px; font-size: 12px;
    background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.8)); }
  .tile em { position: absolute; top: 6px; left: 6px; font-style: normal; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px;
    background: rgba(0,0,0,0.6); }
  .tile em.super { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  #gempty { color: var(--muted); grid-column: 1 / -1; text-align: center; margin-top: 60px; }

  /* settings */
  label.set { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; color: var(--muted); font-size: 14px; }
  label.set select, label.set input[type=range] { font: inherit; color: var(--text); }
  label.set select { padding: 10px; border-radius: 10px; background: #2a2a30; border: 1px solid var(--line); }
  label.chk { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
  #ver { font-size: 12px; color: var(--muted); margin-top: 8px; }
  #toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--safe-t) + 70px); padding: 10px 16px; border-radius: 12px;
    background: rgba(30,30,36,0.95); border: 1px solid var(--line); font-size: 15px; max-width: 90%; text-align: center; }
</style>
</head>
<body>
<video id="live" playsinline muted autoplay></video>
<div id="status"><i></i><span>Starting…</span></div>
<button id="gear" aria-label="Settings">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

<div id="bar">
  <button class="shot" id="btnGallery" aria-label="Gallery"><span class="disc" id="lastThumb"></span>Gallery</button>
  <button class="shot" id="btnPhoto" disabled><span class="disc">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
  </span>Photo</button>
  <button class="shot" id="btnSuper" disabled><span class="disc">
    <svg width="42" height="42" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9z"/><path d="M19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z" opacity=".85"/></svg>
  </span>Super photo</button>
</div>

<!-- capturing: hold steady -->
<div class="overlay" id="hold" hidden>
  <svg id="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" stroke="rgba(255,255,255,0.25)"/><circle id="ringArc" cx="60" cy="60" r="50" stroke="url(#g)" stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="314.16" stroke-dashoffset="314.16"/><defs><linearGradient id="g"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22c3e6"/></linearGradient></defs></svg>
  <h2>Hold steady…</h2>
  <p>Tiny wiggles are good, big moves are not.</p>
</div>

<!-- processing -->
<div class="overlay" id="busy" hidden>
  <div class="card">
    <h2>Making your super photo…</h2>
    <p id="busyStage">Collecting frames</p>
    <div class="bar"><div id="busyBar"></div></div>
    <div class="row"><button class="btn" id="busyCancel">Cancel</button></div>
  </div>
</div>

<!-- messages (errors, no microscope) -->
<div class="overlay" id="msg" hidden style="background: rgba(0,0,0,0.6)">
  <div class="card">
    <h2 id="msgTitle"></h2>
    <p id="msgText"></p>
    <div class="row" id="msgButtons"></div>
  </div>
</div>

<!-- image viewer -->
<div id="viewer" hidden>
  <div id="vscroll"><img id="vimg" alt=""></div>
  <div id="badge" hidden></div>
  <div id="vtop">
    <button class="round" id="vclose" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <div id="vtitle"></div>
    <button class="round" id="vzoom" aria-label="Zoom"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg></button>
  </div>
  <div id="vnote" hidden></div>
  <div id="vbottom">
    <button class="pill" id="vbefore" hidden>Before / after</button>
    <button class="pill" id="vshare"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>Save / share</button>
    <button class="pill" id="vdelete">Delete</button>
  </div>
</div>

<!-- gallery -->
<div id="gallery" hidden>
  <div id="ghead"><h2>Gallery</h2><button class="round" id="gclose" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div id="grid"></div>
</div>

<!-- settings -->
<div class="overlay" id="settings" hidden style="background: rgba(0,0,0,0.6)">
  <div class="card">
    <h2>Settings</h2>
    <label class="set">Camera<select id="camSel"></select></label>
    <label class="set">Super photo recording: <b id="durLabel" style="color: var(--text)"></b><input type="range" id="dur" min="4" max="8" step="1"></label>
    <label class="chk"><input type="checkbox" id="details"> Show technical details on photos</label>
    <div id="ver"></div>
    <div class="row"><button class="btn" id="setReload">Restart camera</button><button class="btn primary" id="setClose">Done</button></div>
  </div>
</div>

<div id="toast" hidden></div>
<canvas id="grab" hidden></canvas>
<script src="app.js"></script>
</body>
</html>
