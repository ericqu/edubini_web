# Publish the iPad web app (web/) to GitHub Pages on every push to main.
# engine.wasm is committed prebuilt (web/build.sh), so no Rust build is needed here.
name: Deploy web app to Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files (app only, no engine sources or dev tools)
        run: |
          mkdir _site
          cp web/index.html web/app.js web/worker.js web/helper.js web/sw.js \
             web/engine.wasm web/manifest.webmanifest _site/
          cp -r web/icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
